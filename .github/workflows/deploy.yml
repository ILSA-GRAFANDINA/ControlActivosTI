name: CD - ControlActivosTI (Instancia EC2)

on:
  push:
    branches:
      - instancia

jobs:
  lint:
    name: Calidad de Codigo (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar errores criticos de Python (bloqueante)
        uses: astral-sh/ruff-action@v3
        with:
          src: "ControlActivosTI"
          args: "check --select E9,F63,F7,F82"

  test:
    name: Pruebas Django & PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: controlactivos_ci_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ControlActivosTI

    env:
      APP_ENV: development
      DEBUG: "True"
      SECRET_KEY: django-insecure-ci-pipeline-key-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_NAME: controlactivos_ci_db
      DB_USER: postgres
      DB_PASSWORD: ci_postgres_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      LANGUAGE_CODE: es-ec
      TIME_ZONE: America/Guayaquil

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ControlActivosTI/requirements.txt"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar migraciones pendientes sin crear
        run: python manage.py makemigrations --check --dry-run

      - name: Validar configuracion Django (check)
        run: python manage.py check

      - name: Ejecutar suite de pruebas
        run: python manage.py test --verbosity=2

  deploy:
    name: Desplegar en EC2 (Ubuntu + Apache/Gunicorn)
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar por SSH en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            REPO_DIR="/home/${{ secrets.EC2_USER }}/ControlActivosTI"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            AUTH_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

            # 1. Clonar si no existe; si ya existe, actualizar rama instancia
            if [ ! -d "${REPO_DIR}/.git" ]; then
              git clone -b instancia "$AUTH_URL" "$REPO_DIR"
              git -C "$REPO_DIR" remote set-url origin "$REPO_URL"
            else
              cd "$REPO_DIR"
              git fetch "$AUTH_URL" instancia
              git checkout instancia
              git reset --hard FETCH_HEAD
            fi

            # 2. Instalacion inicial en EC2 virgen si aun no existe el venv
            if [ ! -x /opt/controlactivosti/venv/bin/python ]; then
              cd "${REPO_DIR}/ControlActivosTI"
              printf "s\n" | sudo bash install_ubuntu.sh
              sudo a2dissite 000-default.conf || true
              sudo systemctl reload apache2
            fi

            # 3. Asegurar base de datos PostgreSQL si aun no existe
            DB_PASS="${{ secrets.DB_PASSWORD }}"
            if [ -n "$DB_PASS" ]; then
              if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='controlactivos_app'" | grep -q 1; then
                printf "CREATE ROLE controlactivos_app LOGIN PASSWORD :'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE;\n" | sudo -u postgres psql -v pass="$DB_PASS"
              fi
              if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='controlactivos'" | grep -q 1; then
                sudo -u postgres psql -c "CREATE DATABASE controlactivos OWNER controlactivos_app ENCODING 'UTF8';"
                sudo -u postgres psql -d controlactivos -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC;"
                sudo -u postgres psql -d controlactivos -c "GRANT USAGE, CREATE ON SCHEMA public TO controlactivos_app;"
              fi
            fi

            # 4. Completar /etc/controlactivosti/controlactivosti.env si tiene valores vacios
            ENV_FILE="/etc/controlactivosti/controlactivosti.env"
            sudo env ENV_FILE="$ENV_FILE" DB_PASS="$DB_PASS" EC2_HOST_VAL="${{ secrets.EC2_HOST }}" /opt/controlactivosti/venv/bin/python - <<'PYEOF'
            import os
            import secrets
            from pathlib import Path

            env_path = Path(os.environ["ENV_FILE"])
            lines = env_path.read_text(encoding="utf-8").splitlines()
            db_pass = os.environ.get("DB_PASS", "")
            ec2_host = os.environ["EC2_HOST_VAL"]

            new_lines = []
            for line in lines:
                if line == "SECRET_KEY=" or (line.startswith("SECRET_KEY=") and any(c in line for c in "()$")):
                    new_lines.append(f"SECRET_KEY={secrets.token_urlsafe(50)}")
                elif line == "DB_PASSWORD=" and db_pass:
                    new_lines.append(f"DB_PASSWORD={db_pass}")
                elif line.startswith("ALLOWED_HOSTS=") and ec2_host not in line:
                    new_lines.append(f"ALLOWED_HOSTS=127.0.0.1,localhost,{ec2_host}")
                elif line.startswith("CSRF_TRUSTED_ORIGINS=") and ec2_host not in line:
                    new_lines.append(f"CSRF_TRUSTED_ORIGINS=http://{ec2_host}")
                else:
                    new_lines.append(line)

            env_path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
            PYEOF

            # 5. Sincronizar codigo a produccion (DEPLOY_PRODUCTION.md)
            sudo rsync -av --delete \
              --exclude='.git' \
              --exclude='.env' \
              --exclude='.venv' \
              --exclude='venv' \
              --exclude='media' \
              --exclude='private_media' \
              --exclude='staticfiles' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='*.sqlite3' \
              --exclude='*.log' \
              "${REPO_DIR}/ControlActivosTI/" \
              /opt/controlactivosti/app/

            sudo /opt/controlactivosti/venv/bin/pip install -r /opt/controlactivosti/app/requirements.txt

            sudo -u controlactivos bash -c '
              set -a; source /etc/controlactivosti/controlactivosti.env; set +a
              cd /opt/controlactivosti/app
              /opt/controlactivosti/venv/bin/python manage.py check
              /opt/controlactivosti/venv/bin/python manage.py migrate --noinput
              /opt/controlactivosti/venv/bin/python manage.py collectstatic --noinput
            '

            sudo chown -R root:controlactivos /opt/controlactivosti/app
            sudo find /opt/controlactivosti/app -type d -exec chmod 750 {} \;
            sudo find /opt/controlactivosti/app -type f -exec chmod 640 {} \;

            sudo systemctl enable --now controlactivosti
            sudo systemctl restart controlactivosti
            curl -fsS http://127.0.0.1:8000/health/
            echo ""
            echo "Despliegue completado correctamente."

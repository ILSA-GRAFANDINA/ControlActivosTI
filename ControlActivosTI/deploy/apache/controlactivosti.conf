<VirtualHost *:80>
    ServerName _

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    LimitRequestBody 20971520

    ProxyPass /static/ !
    Alias /static/ /var/www/controlactivosti/static/
    <Directory /var/www/controlactivosti/static/>
        Require all granted
        Options -Indexes
    </Directory>

    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/controlactivosti-error.log
    CustomLog ${APACHE_LOG_DIR}/controlactivosti-access.log combined

    # HTTPS futuro: cree un VirtualHost *:443, habilite ssl, cambie
    # X-Forwarded-Proto a "https" y active ENABLE_HTTPS en el entorno.
</VirtualHost>
